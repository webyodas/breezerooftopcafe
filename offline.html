<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Breeze The Roof-Top Café</title>
  <link rel="icon" type="image/png" href="/assets/logo-emblem.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #faf7f2;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .offline-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .offline-logo {
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
      filter: drop-shadow(0 4px 16px rgba(181, 136, 61, 0.3));
    }
    .offline-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .offline-desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .offline-btn {
      background: linear-gradient(135deg, #b5883d 0%, #936b2b 100%);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .offline-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(181, 136, 61, 0.4);
    }
    .offline-status {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <img src="assets/logo-transparent.png" alt="Breeze Cafe" class="offline-logo">
    <h1 class="offline-title">You are currently offline</h1>
    <p class="offline-desc">
      It looks like your internet connection dropped. Breeze is ready to reconnect as soon as signal returns.
    </p>
    <button type="button" class="offline-btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      Tap to Reconnect
    </button>
    <div class="offline-status" id="offlineStatus">Checking connection...</div>
  </div>
  <script>
    window.addEventListener('online', () => {
      document.getElementById('offlineStatus').textContent = 'Signal restored! Reconnecting...';
      setTimeout(() => window.location.reload(), 1000);
    });
    window.addEventListener('offline', () => {
      document.getElementById('offlineStatus').textContent = 'Device is disconnected from network';
    });
  </script>
</body>
</html>
